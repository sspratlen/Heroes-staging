<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Heroes Senior Softball — Competitive senior men's softball organization featuring 55's AAA, 50's AAA, and 50's AA teams in Omaha, NE.">
  <meta name="theme-color" content="#C8102E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Heroes SSB">
  <title>Heroes Senior Softball</title>
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="manifest" href="/manifest.json">

  <!-- ▼▼▼ ADDED: Google Fonts for Scoreboard Light theme ▼▼▼ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=Archivo+Narrow:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- ▲▲▲ END Google Fonts ▲▲▲ -->

  <link rel="stylesheet" href="assets/css/style.css">

  <!-- ▼▼▼ ADDED: Scoreboard Light overlay (load AFTER style.css) ▼▼▼ -->
  <link rel="stylesheet" href="assets/css/heroes-scoreboard.css">
  <!-- ▲▲▲ END overlay CSS ▲▲▲ -->

  <link rel="preload" href="assets/img/heroes-logo.jpg" as="image">
</head>
<body>

<!-- ════ SITE HEADER ════════════════════════════════════════ -->
<header id="site-header">
  <div class="header-inner">
    <a class="site-logo" data-route="/" href="#">
      <img src="assets/img/heroes-logo.jpg" alt="Heroes Logo" onerror="this.style.display='none'">
      <div class="site-logo-text">
        <span class="org">Senior Softball · Omaha</span>
        <span class="name">Heroes <span>SSB</span></span>
      </div>
    </a>
    <nav id="main-nav" role="navigation" aria-label="Main navigation">
      <!-- Built dynamically by app.js / overlay -->
    </nav>
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">☰</button>
  </div>
  <div id="mobile-nav" aria-label="Mobile navigation">
    <!-- Built dynamically by app.js / overlay -->
  </div>
</header>

<!-- ════ MAIN CONTENT ═══════════════════════════════════════ -->
<main id="main-content" role="main">
  <div style="display:flex;align-items:center;justify-content:center;min-height:400px">
    <div class="spinner"></div>
  </div>
</main>

<!-- ════ SITE FOOTER ════════════════════════════════════════ -->
<footer id="site-footer" role="contentinfo">
  <!-- Built dynamically by app.js / overlay -->
</footer>

<!-- ════ SCRIPTS ════════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/photo-picker.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>

<!-- ▼▼▼ ADDED: IA overlay — must load AFTER app.js ▼▼▼ -->
<script src="assets/js/heroes-scoreboard.js"></script>
<!-- ▲▲▲ END overlay JS ▲▲▲ -->

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
