<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Heroes — Players</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px 16px;
    }

    .join-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
    }

    .join-body { padding: 28px 28px 20px; }

    .join-loading {
      text-align: center;
      padding: 48px 0;
      color: #aaa;
      font-size: 14px;
    }
    .join-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e7eb;
      border-top-color: #C8102E;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .join-footer {
      text-align: center;
      padding: 14px;
      background: #f8f8f8;
      border-top: 1px solid #e5e7eb;
      font-size: 12px;
      color: #aaa;
    }
    .join-footer a { color: #C8102E; text-decoration: none; }
    .join-footer a:hover { text-decoration: underline; }

    .form-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }
    .form-header img {
      width: 50px; height: 50px; border-radius: 50%;
      object-fit: contain; border: 2px solid #C8102E; flex-shrink: 0;
    }
    .form-title   { font-size: 20px; font-weight: 900; color: #111; line-height: 1.2; }
    .form-subtitle { font-size: 13px; color: #888; margin-top: 2px; }

    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .5px; color: #666; margin-bottom: 5px;
    }
    .form-input {
      width: 100%; padding: 10px 13px; border: 1px solid #ddd;
      border-radius: 7px; font-size: 14px; outline: none;
      font-family: inherit; transition: border-color .15s; color: #111;
    }
    .form-input:focus { border-color: #C8102E; }
    .form-error { font-size: 13px; color: #C8102E; min-height: 18px; margin-bottom: 10px; }

    .btn-primary {
      display: block; width: 100%; padding: 13px;
      background: #C8102E; color: #fff; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 800; cursor: pointer;
      font-family: inherit; transition: opacity .15s; margin-bottom: 8px;
    }
    .btn-primary:hover   { opacity: .88; }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; }

    .result-state { text-align: center; padding: 12px 0 4px; }
    .result-icon  { font-size: 52px; margin-bottom: 16px; line-height: 1; }
    .result-title { font-size: 20px; font-weight: 900; margin-bottom: 10px; color: #111; }
    .result-msg   { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 24px; }
  </style>
</head>
<body>

<div class="join-card">
  <div class="join-body" id="page-body">
    <div class="join-loading">
      <div class="join-spinner"></div>
      Loading…
    </div>
  </div>
  <div class="join-footer">
    <a href="index.html">heroesseniorsoftball.com</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(async () => {
  const sb   = _getClient();
  const body = document.getElementById('page-body');

  // ── Already logged in ──────────────────────────────────────
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    body.innerHTML = `
      <div class="result-state">
        <div class="result-icon">⚾</div>
        <h2 class="result-title">You're already signed in!</h2>
        <p class="result-msg">Head back to the Heroes site to see the latest news and scores.</p>
        <a href="index.html" class="btn-primary" style="display:inline-block;text-decoration:none;max-width:260px;padding:13px 24px">Go to Heroes →</a>
      </div>`;
    return;
  }

  // ── Fetch teams for dropdown ───────────────────────────────
  let teams = [];
  try {
    const { data } = await sb.from('teams').select('legacy_id, name').order('name');
    teams = data || [];
  } catch (_) {}

  const teamOptions = teams.length
    ? teams.map(t => `<option value="${t.legacy_id}">${t.name}</option>`).join('')
    : '<option value="">No teams found</option>';

  // ── Render signup form ─────────────────────────────────────
  body.innerHTML = `
    <div class="form-header">
      <img src="assets/img/heroes-logo.jpg" alt="Heroes Logo"
           onerror="this.style.background='#C8102E';this.style.borderRadius='50%'">
      <div>
        <div class="form-title">Join the Heroes!</div>
        <div class="form-subtitle">Player sign-up — enter your info to get matched to your roster.</div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="pi-first">First Name</label>
      <input type="text" id="pi-first" class="form-input" placeholder="First"
             autocomplete="given-name"
             onkeydown="if(event.key==='Enter')document.getElementById('pi-last').focus()">
    </div>
    <div class="form-group">
      <label class="form-label" for="pi-last">Last Name</label>
      <input type="text" id="pi-last" class="form-input" placeholder="Last"
             autocomplete="family-name"
             onkeydown="if(event.key==='Enter')document.getElementById('pi-email').focus()">
    </div>
    <div class="form-group">
      <label class="form-label" for="pi-email">Email</label>
      <input type="email" id="pi-email" class="form-input" placeholder="you@example.com"
             autocomplete="email"
             onkeydown="if(event.key==='Enter')document.getElementById('pi-pw').focus()">
    </div>
    <div class="form-group">
      <label class="form-label" for="pi-pw">Password</label>
      <input type="password" id="pi-pw" class="form-input" placeholder="Min 6 characters"
             autocomplete="new-password"
             onkeydown="if(event.key==='Enter')document.getElementById('pi-team').focus()">
    </div>
    <div class="form-group">
      <label class="form-label" for="pi-team">My Team</label>
      <select id="pi-team" class="form-input" style="cursor:pointer">
        ${teamOptions}
      </select>
    </div>

    <div id="pi-error" class="form-error" aria-live="polite"></div>

    <button class="btn-primary" id="pi-submit" onclick="window._submitPlayerInvite()">Create Account</button>`;

  document.getElementById('pi-first')?.focus();

  window._submitPlayerInvite = async function() {
    const first  = document.getElementById('pi-first').value.trim();
    const last   = document.getElementById('pi-last').value.trim();
    const email  = document.getElementById('pi-email').value.trim();
    const pw     = document.getElementById('pi-pw').value;
    const teamId = document.getElementById('pi-team').value;
    const errEl  = document.getElementById('pi-error');
    const btn    = document.getElementById('pi-submit');

    errEl.textContent = '';

    if (!first)                               { errEl.textContent = 'Please enter your first name.'; return; }
    if (!last)                                { errEl.textContent = 'Please enter your last name.'; return; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = 'Please enter a valid email.'; return; }
    if (!pw || pw.length < 6)                 { errEl.textContent = 'Password must be at least 6 characters.'; return; }
    if (!teamId)                              { errEl.textContent = 'Please select your team.'; return; }

    btn.disabled = true;
    btn.textContent = 'Creating account…';

    const { data, error } = await sb.auth.signUp({
      email,
      password: pw,
      options: { data: { display_name: `${first} ${last}`, requested_role: 'player' } },
    });

    if (error) {
      errEl.textContent = error.message || 'Sign-up failed. Please try again.';
      btn.disabled = false;
      btn.textContent = 'Create Account';
      return;
    }

    const token = data?.session?.access_token;
    let matched = false;

    if (token) {
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/player-signup`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify({ email, firstName: first, lastName: last, teamId }),
        });
        const result = await res.json();
        matched = result.matched === true;
      } catch (_) {}
    }

    if (matched) {
      body.innerHTML = `
        <div class="result-state">
          <div class="result-icon">⚾</div>
          <h2 class="result-title">Welcome to the Heroes!</h2>
          <p class="result-msg">We matched you to your roster record — you're all set. Redirecting you now…</p>
        </div>`;
      setTimeout(() => { window.location.href = 'index.html'; }, 2500);
    } else {
      body.innerHTML = `
        <div class="result-state">
          <div class="result-icon">⏳</div>
          <h2 class="result-title">You're on the list!</h2>
          <p class="result-msg">
            Your account is pending approval. A team admin will review it shortly —
            you'll have full access once approved.
          </p>
          <a href="index.html" class="btn-primary" style="display:inline-block;text-decoration:none;max-width:260px;padding:13px 24px">Back to Heroes</a>
        </div>`;
    }
  };
})();
</script>

</body>
</html>
